<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 728" width="100%" class="cmf-fig" role="img" aria-labelledby="statistics-t statistics-d" data-search-exclude="">
<title id="statistics-t">Statistics on the GPU, saved in the background</title>
<desc id="statistics-d">Model state on the GPU is filtered to the requested variables and saved catchments; accumulators are updated every sub-step on the device and only finished windows are copied off. Background writer processes compress and write NetCDF while the GPU simulates the next days.</desc>
