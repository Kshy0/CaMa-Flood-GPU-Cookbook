<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 496" width="100%" class="cmf-fig" role="img" aria-labelledby="substeps-t substeps-d" data-search-exclude="">
<title id="substeps-t">One model step, sliced into sub-steps</title>
<desc id="substeps-d">One day of the schedule is solved as N equal sub-steps, dt = T/N, with N fixed or recomputed each day from a CFL limit. Runoff is a constant mean rate across the day. Statistics are updated at every sub-step, and the finished window produces one record.</desc>
