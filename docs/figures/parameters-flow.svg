<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 704" width="100%" class="cmf-fig" role="img" aria-labelledby="parameters-flow-t parameters-flow-d" data-search-exclude="">
<title id="parameters-flow-t">From CaMa map files to GPU tensors</title>
<desc id="parameters-flow-d">The parameter file is built once per map from CaMa map files, then loaded at the start of each run: fields are filtered by the opened modules, split into topology, parameters, initial state, forcing and derived fields, and whole basins are partitioned across GPUs. A checkpoint stores topology, parameters and the current state.</desc>
