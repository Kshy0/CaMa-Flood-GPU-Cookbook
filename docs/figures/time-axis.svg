<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 578" width="100%" class="cmf-fig" role="img" aria-labelledby="time-axis-t time-axis-d" data-search-exclude="">
<title id="time-axis-t">Spin-up, main period, statistics windows</title>
<desc id="time-axis-d">Spin-up cycles replay one window without statistics or output; the main period follows. March 2000 is shown as 31 daily model steps, each with a constant runoff rate. Daily means form the inner window; the monthly maximum of those means (max_mean) is the outer window. Daily records are stamped at 00:00 of their day; the monthly record at the start of its last day window.</desc>
