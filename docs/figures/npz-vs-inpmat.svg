<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 426" width="100%" class="cmf-fig" role="img" aria-labelledby="npz-vs-inpmat-t npz-vs-inpmat-d" data-search-exclude="">
<title id="npz-vs-inpmat-t">Same weights, two layouts</title>
<desc id="npz-vs-inpmat-d">Left: Fortran CaMa-Flood inpmat stores 3 times INPN dense map-sized records (inpx, inpy, inpa), 1-based and padded with zeros. Right: the CaMa-Flood-GPU .npz stores the same overlap areas as a CSR matrix with one row per catchment, 0-based flat cell indices, and the grid coordinates. export_inpmat converts .npz to inpmat.</desc>
